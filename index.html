<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SensoryAR v9</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#080810; color:#f0f0f0; font-family:Arial,sans-serif; height:100dvh; overflow:hidden; }
.screen { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; background:#080810; }
h1 { font-size:2.6rem; font-weight:900; color:#e8ff50; letter-spacing:-.02em; margin-bottom:.2rem; }
.ver { font-size:.58rem; letter-spacing:.25em; color:#444; text-transform:uppercase; margin-bottom:1.4rem; }
.hint { width:100%; max-width:340px; margin-bottom:1.2rem; background:rgba(232,255,80,.04); border:1px solid rgba(232,255,80,.15); border-radius:14px; padding:.9rem 1.1rem; font-size:.7rem; line-height:1.85; color:#999; }
.hint strong { color:#e8ff50; }
.bp { font-weight:700; font-size:.8rem; background:#e8ff50; color:#080810; border:none; border-radius:50px; padding:.9rem 2rem; cursor:pointer; width:100%; max-width:340px; margin-bottom:.6rem; }
.bp:disabled { opacity:.3; cursor:not-allowed; }
.bs { font-size:.68rem; background:transparent; border:1px solid #222; color:#444; border-radius:50px; padding:.65rem 2rem; cursor:pointer; width:100%; max-width:340px; }
#no-xr { font-size:.65rem; color:#ff5566; margin-top:.8rem; display:none; text-align:center; }
.snum { font-size:4.5rem; font-weight:900; color:#e8ff50; line-height:1; margin-bottom:.3rem; }
#sbd { width:100%; max-width:300px; margin-bottom:1.5rem; }
.sr { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid #111; font-size:.7rem; }
.sr:last-child{border:none;} .ok{color:#e8ff50;} .fail{color:#ff5566;}
</style>
</head>
<body>

<div class="screen" id="start">
  <h1>SensoryAR</h1>
  <div class="ver">v9 · Ghost Hands · Wrist Ray</div>
  <div class="hint">
    <strong>🖐 Управление руками:</strong><br>
    Полупрозрачные руки повторяют твои движения.<br>
    Из запястья выходит луч — наведи на кнопку.<br>
    <strong>Щипок</strong> (pinch) = выбор. Луч не уходит вниз!<br>
    Панель фиксирована в пространстве.
  </div>
  <button class="bp" id="ar-btn">🥽 Войти в AR</button>
  <button class="bs" id="demo-btn">🖥 Демо (мышь)</button>
  <div id="no-xr">WebXR недоступен. Откройте в Meta Browser.</div>
</div>

<div class="screen" id="score-screen" style="display:none">
  <div style="font-size:.55rem;letter-spacing:.25em;color:#333;text-transform:uppercase;margin-bottom:1rem">Сессия завершена</div>
  <div class="snum" id="sc-num">0/0</div>
  <div style="font-size:.72rem;color:#444;margin-bottom:1.5rem" id="sc-pct"></div>
  <div id="sbd"></div>
  <button class="bp" id="restart-btn" style="max-width:300px">↺ Заново</button>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// ═══ DATA ══════════════════════════════════════════════════════════════════
const TASTES = [
  {id:'sweet',  label:'Сладкий', emoji:'🍬', hex:0xffaacc, mol:'Сахароза',    thr:'0.5–2 г/л',    desc:'Рецепторы T1R2/T1R3'},
  {id:'salty',  label:'Солёный', emoji:'🧂', hex:0x55ccff, mol:'NaCl',         thr:'0.3–1 г/л',    desc:'Na⁺ → ENaC-каналы'},
  {id:'bitter', label:'Горький', emoji:'☕', hex:0xddaa44, mol:'Кофеин',       thr:'0.05–0.3 г/л', desc:'>25 типов TAS2R'},
  {id:'umami',  label:'Умами',   emoji:'🍖', hex:0xff8866, mol:'Глутамат Na',  thr:'0.1–0.5 г/л',  desc:'Синергист ИМФ/ГМФ'},
  {id:'pungent',label:'Острый',  emoji:'🌶', hex:0xff5555, mol:'Капсаицин',    thr:'0.0003 г/л',   desc:'TRPV1 тригеминальный'},
];

const JOINT_NAMES=[
  'wrist',
  'thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip',
  'index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip',
  'middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip',
  'ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip',
  'pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip',
];

// Bone pairs (A→B indices)
const BONES=[
  [0,1],[1,2],[2,3],[3,4],             // thumb
  [0,5],[5,6],[6,7],[7,8],[8,9],       // index
  [0,10],[10,11],[11,12],[12,13],[13,14], // middle
  [0,15],[15,16],[16,17],[17,18],[18,19], // ring
  [0,20],[20,21],[21,22],[22,23],[23,24], // pinky
  [5,10],[10,15],[15,20],              // palm knuckles
];

// Joint radii (fingertip slightly larger)
const JOINT_R = Array.from({length:25}, (_,i)=> i%5===4?0.009:i===0?0.012:0.007);

// ═══ RENDERER ══════════════════════════════════════════════════════════════
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.setClearColor(0x000000,0);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.001,100);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const dl=new THREE.DirectionalLight(0xffffff,0.5); dl.position.set(1,3,2); scene.add(dl);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ═══ GHOST HAND MATERIAL ══════════════════════════════════════════════════
// Semi-transparent pale blue-white, like Quest's default hand
const ghostMat = new THREE.MeshPhongMaterial({
  color:    0xc8e4ff,
  emissive: 0x102030,
  transparent: true,
  opacity:  0.38,
  side: THREE.FrontSide,
  depthWrite: false,
});
const ghostMatPinch = new THREE.MeshPhongMaterial({
  color:    0xe8ff50,
  emissive: 0x404010,
  transparent: true,
  opacity:  0.55,
  side: THREE.FrontSide,
  depthWrite: false,
});

// ═══ GHOST HAND BUILDER ════════════════════════════════════════════════════
class GhostHand {
  constructor(){
    this.group = new THREE.Group();
    scene.add(this.group);
    this.joints = []; // sphere meshes
    this.bones  = []; // cylinder meshes

    // Joint spheres
    for(let i=0;i<25;i++){
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(JOINT_R[i], 10, 10),
        ghostMat.clone()
      );
      m.visible=false;
      this.group.add(m);
      this.joints.push(m);
    }

    // Bone cylinders (between joint pairs)
    BONES.forEach(([a,b])=>{
      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(0.005, 0.005, 1, 8), // height=1, will be scaled
        ghostMat.clone()
      );
      m.visible=false;
      m.userData={a,b};
      this.group.add(m);
      this.bones.push(m);
    });

    this.poses = new Array(25).fill(null);
    this.visible = false;
  }

  // Update from XR frame
  update(hand, frame, refSpace, isPinching){
    const poses = [];
    let anyValid = false;

    JOINT_NAMES.forEach((name,ji)=>{
      const jt = hand.get(name);
      if(!jt){ poses.push(null); return; }
      const p = frame.getJointPose(jt, refSpace);
      if(!p){ poses.push(null); return; }
      poses.push(p.transform.position);
      anyValid = true;
    });

    this.poses = poses;

    if(!anyValid){
      this.group.children.forEach(c=>c.visible=false);
      return;
    }

    // Update joint spheres
    this.joints.forEach((m,i)=>{
      const p=poses[i];
      if(!p){ m.visible=false; return; }
      m.position.set(p.x,p.y,p.z);
      // Pinch highlight on index tip (#9) and thumb tip (#4)
      const isPinchJoint = (i===9||i===4);
      m.material.color.setHex(isPinching && isPinchJoint ? 0xe8ff50 : 0xc8e4ff);
      m.material.emissive.setHex(isPinching && isPinchJoint ? 0x606010 : 0x102030);
      m.material.opacity = isPinching && isPinchJoint ? 0.8 : 0.38;
      m.visible=true;
    });

    // Update bone cylinders
    this.bones.forEach(m=>{
      const {a,b}=m.userData;
      const pa=poses[a], pb=poses[b];
      if(!pa||!pb){ m.visible=false; return; }
      const A=new THREE.Vector3(pa.x,pa.y,pa.z);
      const B=new THREE.Vector3(pb.x,pb.y,pb.z);
      const mid=new THREE.Vector3().addVectors(A,B).multiplyScalar(0.5);
      const len=A.distanceTo(B);
      m.position.copy(mid);
      m.scale.set(1,len,1);
      m.quaternion.setFromUnitVectors(
        new THREE.Vector3(0,1,0),
        new THREE.Vector3().subVectors(B,A).normalize()
      );
      m.visible=true;
    });
  }

  // Get wrist position and hand-pointing direction for ray
  getWristRay(){
    const wrist = this.poses[0];      // wrist
    const mid3  = this.poses[12];     // middle finger intermediate
    const idx3  = this.poses[7];      // index finger intermediate
    if(!wrist||!mid3) return null;

    const W = new THREE.Vector3(wrist.x, wrist.y, wrist.z);
    const M = new THREE.Vector3(mid3.x, mid3.y, mid3.z);

    // Ray origin: slightly above wrist toward knuckles
    const dir = new THREE.Vector3().subVectors(M, W).normalize();
    const origin = W.clone().addScaledVector(dir, 0.06); // 6cm from wrist along hand

    return { origin, dir };
  }
}

const HANDS = [new GhostHand(), new GhostHand()];

// ═══ WRIST RAY ═════════════════════════════════════════════════════════════
const rayMat = new THREE.LineBasicMaterial({
  color: 0xe8ff50, transparent: true, opacity: 0.7
});
const rayGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(), new THREE.Vector3(0,0,-1)
]);
const rayLine = new THREE.Line(rayGeo, rayMat);
scene.add(rayLine); rayLine.visible=false;

// Ray hit dot
const hitDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.008, 8, 8),
  new THREE.MeshPhongMaterial({color:0xe8ff50, emissive:0x808010})
);
scene.add(hitDot); hitDot.visible=false;

// ═══ CANVAS TEXTURE HELPER ══════════════════════════════════════════════════
function makeTex(w,h,fn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); fn(ctx,w,h);
  return new THREE.CanvasTexture(c);
}
function solidMesh(w,h,tex){
  return new THREE.Mesh(
    new THREE.PlaneGeometry(w,h),
    new THREE.MeshPhongMaterial({map:tex,side:THREE.DoubleSide})
  );
}

// ═══ UI — fixed world space ═════════════════════════════════════════════════
const UI=new THREE.Group(); scene.add(UI);
let uiPlaced=false;

// Background
UI.add(solidMesh(0.82,0.62,makeTex(820,620,(ctx,W,H)=>{
  ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'rgba(232,255,80,0.03)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(232,255,80,0.18)'; ctx.lineWidth=2;
  ctx.strokeRect(1,1,W-2,H-2);
})));

let scoreMesh=null;
function buildScore(ok,tot,n,total){
  if(scoreMesh)UI.remove(scoreMesh);
  const tex=makeTex(820,70,(ctx,W,H)=>{
    ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(232,255,80,0.1)'; ctx.fillRect(0,H-2,W,2);
    ctx.fillStyle='#e8ff50'; ctx.font='bold 26px Arial';
    ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(`✓ ${ok} / ${tot}`, 24, H/2);
    ctx.fillStyle='#333'; ctx.font='22px Arial';
    ctx.textAlign='right';
    ctx.fillText(`${n} / ${total}`, W-24, H/2);
  });
  scoreMesh=solidMesh(0.82,0.07,tex);
  scoreMesh.position.set(0,0.275,0.001);
  UI.add(scoreMesh);
}

let qMesh=null;
function buildQ(txt){
  if(qMesh)UI.remove(qMesh);
  const tex=makeTex(820,80,(ctx,W,H)=>{
    ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.font='bold 26px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(txt,W/2,H/2);
  });
  qMesh=solidMesh(0.82,0.080,tex);
  qMesh.position.set(0,0.185,0.001);
  UI.add(qMesh);
}

// Buttons
const BTNS=[];
let hovId=null,btnStates={};
const BW=0.24, BH=0.082, GAP=0.012;

function buildBtns(states){
  BTNS.forEach(b=>UI.remove(b.mesh)); BTNS.length=0;
  [[0,1],[2,3]].forEach((pair,row)=>{
    pair.forEach((ti,col)=>{
      const t=TASTES[ti];
      const st=states[t.id]||'normal';
      const x=(col===0?-1:1)*(BW/2+GAP/2);
      const y=0.07-row*(BH+GAP);
      _makeBtn(t,st,x,y,BW,BH);
    });
  });
  const t5=TASTES[4]; const st5=states[t5.id]||'normal';
  _makeBtn(t5,st5,0,0.07-2*(BH+GAP),BW*2+GAP,BH);
}

function _makeBtn(t,st,x,y,bw,bh){
  let bg='#111118', brd='rgba(255,255,255,0.07)';
  if(st==='hov')    {bg='rgba(232,255,80,0.03)'; brd='rgba(232,255,80,0.35)';}
  if(st==='correct'){bg='rgba(60,255,80,0.08)';  brd='rgba(60,255,80,0.5)';}
  if(st==='wrong')  {bg='rgba(220,50,50,0.08)';  brd='rgba(220,50,50,0.5)';}
  const PW=Math.round(bw*1000), PH=Math.round(bh*1000);
  const tex=makeTex(PW,PH,(ctx,W,H)=>{
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=brd; ctx.lineWidth=3; ctx.strokeRect(2,2,W-4,H-4);
    const c3=new THREE.Color(t.hex);
    let fc='#'+c3.getHexString();
    if(st==='correct') fc='#88ff88';
    if(st==='wrong')   fc='#ff7777';
    ctx.fillStyle=fc; ctx.font=`bold ${Math.round(H*0.38)}px Arial`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.emoji+' '+t.label, W/2, H/2);
  });
  const mesh=solidMesh(bw,bh,tex);
  mesh.position.set(x,y,0.002);
  UI.add(mesh);
  BTNS.push({mesh,id:t.id});
}

let fbMesh=null, nextMesh=null, feedOk=false, feedTaste=null;
const NEXT_Y=-0.225;

function buildFeedback(ok,t){
  clearFeedback();
  const tex=makeTex(820,230,(ctx,W,H)=>{
    ctx.fillStyle=ok?'rgba(40,120,40,0.18)':'rgba(160,30,30,0.18)';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=ok?'rgba(80,220,80,0.7)':'rgba(220,60,60,0.7)';
    ctx.lineWidth=3; ctx.strokeRect(2,2,W-4,H-4);
    ctx.fillStyle=ok?'#88ff88':'#ff7777';
    ctx.font='bold 28px Arial'; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText((ok?'✓  ':'✗  ')+t.emoji+' '+t.label,W/2,18);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.font='bold 22px Arial';
    ctx.fillText(t.mol,W/2,64);
    ctx.fillStyle='rgba(180,190,255,0.7)'; ctx.font='18px Arial';
    ctx.fillText('Порог: '+t.thr,W/2,100);
    ctx.fillStyle='rgba(150,155,180,0.65)'; ctx.font='17px Arial';
    ctx.fillText(t.desc,W/2,132);
  });
  fbMesh=solidMesh(0.82,0.23,tex);
  fbMesh.position.set(0,0.11,0.002);
  UI.add(fbMesh);

  const ntex=makeTex(740,82,(ctx,W,H)=>{
    const isHov=hovId==='__next__';
    ctx.fillStyle=isHov?'#f5ff80':'#e8ff50'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=isHov?'#ffffff':'rgba(0,0,0,0)'; ctx.lineWidth=3; ctx.strokeRect(2,2,W-4,H-4);
    ctx.fillStyle='#080810'; ctx.font='bold 24px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('→  Следующий образец',W/2,H/2);
  });
  nextMesh=solidMesh(0.74,0.082,ntex);
  nextMesh.position.set(0,NEXT_Y,0.002);
  UI.add(nextMesh);
}

function clearFeedback(){
  if(fbMesh){UI.remove(fbMesh);fbMesh=null;}
  if(nextMesh){UI.remove(nextMesh);nextMesh=null;}
}

// ═══ RAYCASTER ═════════════════════════════════════════════════════════════
const RC=new THREE.Raycaster();
function getHittables(){
  if(phase==='q') return BTNS.filter(b=>btnStates[b.id]==='normal'||btnStates[b.id]==='hov').map(b=>b.mesh);
  if(phase==='f'&&nextMesh) return [nextMesh];
  return [];
}
function rayHit(org,dir){
  RC.set(org,dir);
  const hits=RC.intersectObjects(getHittables());
  if(!hits.length) return null;
  const b=BTNS.find(b=>b.mesh===hits[0].object);
  if(b) return {id:b.id, point:hits[0].point};
  if(hits[0].object===nextMesh) return {id:'__next__', point:hits[0].point};
  return null;
}
function setHov(id){
  if(id===hovId) return;
  if(hovId&&hovId!=='__next__'&&btnStates[hovId]==='hov') btnStates[hovId]='normal';
  hovId=id;
  if(hovId&&hovId!=='__next__') btnStates[hovId]='hov';
  if(phase==='q') buildBtns(btnStates);
  if(phase==='f') buildFeedback(feedOk,feedTaste); // refresh next button hover
}

// ═══ SESSION ═══════════════════════════════════════════════════════════════
let xrSession=null, demoMode=false;
let queue=[],qi=0,okCount=0,totCount=0,answered=false,results=[];
let phase='q', lastPinch=false;

function startSess(){
  queue=[...TASTES,...TASTES].sort(()=>Math.random()-.5);
  qi=0;okCount=0;totCount=0;answered=false;results=[];
  TASTES.forEach(t=>btnStates[t.id]='normal');
  uiPlaced=false; UI.visible=true;
  clearFeedback(); showSample();
}
function showSample(){
  if(qi>=queue.length){endSess();return;}
  answered=false; phase='q'; hovId=null;
  TASTES.forEach(t=>btnStates[t.id]='normal');
  clearFeedback();
  buildScore(okCount,totCount,qi+1,queue.length);
  buildQ(`Попробуйте образец № ${qi+1} — определите вкус`);
  buildBtns(btnStates);
}
function onAnswer(id){
  if(answered||phase!=='q')return; answered=true;
  const t=queue[qi]; const ok=id===t.id;
  if(ok)okCount++; totCount++;
  results.push({taste:t,answer:id,ok});
  TASTES.forEach(bt=>{
    if(bt.id===t.id)         btnStates[bt.id]='correct';
    else if(bt.id===id&&!ok) btnStates[bt.id]='wrong';
    else                     btnStates[bt.id]='normal';
  });
  buildBtns(btnStates);
  buildScore(okCount,totCount,qi+1,queue.length);
  if(qMesh){UI.remove(qMesh);qMesh=null;}
  feedOk=ok; feedTaste=t; phase='f'; hovId=null;
  buildFeedback(ok,t);
}
function doSelect(id){
  if(!id)return;
  if(id==='__next__'){qi++;showSample();}
  else onAnswer(id);
}
function endSess(){
  UI.visible=false; rayLine.visible=false; hitDot.visible=false;
  const pct=totCount?Math.round(okCount/totCount*100):0;
  document.getElementById('sc-num').textContent=`${okCount}/${totCount}`;
  document.getElementById('sc-pct').textContent=pct>=90?`${pct}% — Отлично!`:pct>=70?`${pct}% — Хорошо.`:`${pct}% — Нужна практика.`;
  const bd=document.getElementById('sbd'); bd.innerHTML='';
  TASTES.forEach(t=>{const r=results.filter(x=>x.taste.id===t.id);const o=r.filter(x=>x.ok).length;bd.innerHTML+=`<div class="sr"><span>${t.emoji} ${t.label}</span><span class="${o===r.length?'ok':'fail'}">${o}/${r.length}</span></div>`;});
  document.getElementById('score-screen').style.display='flex';
  if(xrSession){xrSession.end();xrSession=null;}
}

// ═══ HAND TRACKING ═════════════════════════════════════════════════════════
function procHands(frame){
  const ref=renderer.xr.getReferenceSpace(); if(!ref)return;
  let anyHand=false;
  let rayOrigin=null, rayDir=null;
  let pinching=false;

  Array.from(xrSession.inputSources).forEach((src,hi)=>{
    if(!src.hand||hi>1)return;
    anyHand=true;

    // Detect pinch first (index tip #9, thumb tip #4)
    const jI=src.hand.get('index-finger-tip');
    const jT=src.hand.get('thumb-tip');
    let isPinching=false;
    if(jI&&jT){
      const pI=frame.getJointPose(jI,ref);
      const pT=frame.getJointPose(jT,ref);
      if(pI&&pT){
        const {x:ix,y:iy,z:iz}=pI.transform.position;
        const {x:tx,y:ty,z:tz}=pT.transform.position;
        const dist=Math.sqrt((ix-tx)**2+(iy-ty)**2+(iz-tz)**2);
        isPinching=dist<0.028;
      }
    }
    if(hi===0) pinching=isPinching;

    // Update ghost hand
    HANDS[hi].update(src.hand, frame, ref, isPinching);

    // Build wrist ray for primary hand (hi===0)
    if(hi===0){
      const wr=HANDS[0].getWristRay();
      if(wr){ rayOrigin=wr.origin; rayDir=wr.dir; }
    }
  });

  if(!anyHand){
    HANDS.forEach(h=>h.group.children.forEach(c=>c.visible=false));
    rayLine.visible=false; hitDot.visible=false;
    lastPinch=false; setHov(null); return;
  }

  // Draw wrist ray
  if(rayOrigin&&rayDir){
    const rayEnd=rayOrigin.clone().addScaledVector(rayDir,1.2);
    rayGeo.setFromPoints([rayOrigin,rayEnd]);
    rayGeo.attributes.position.needsUpdate=true;
    rayLine.visible=true;

    // Ray hit test
    const hit=rayHit(rayOrigin,rayDir);
    setHov(hit?.id||null);
    if(hit){
      hitDot.position.copy(hit.point);
      hitDot.visible=true;
      rayMat.color.setHex(0xe8ff50);
    } else {
      hitDot.visible=false;
      rayMat.color.setHex(0x888888);
    }
  }

  // Pinch rising edge = select
  if(pinching&&!lastPinch) doSelect(hovId);
  lastPinch=pinching;
}

// ═══ UI PLACEMENT (once) ═══════════════════════════════════════════════════
function placeUI(){
  if(uiPlaced)return;
  const xc=renderer.xr.getCamera(camera);
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(xc.quaternion);
  fwd.y=0; fwd.normalize();
  UI.position.set(
    xc.position.x+fwd.x*0.85,
    xc.position.y+0.05,
    xc.position.z+fwd.z*0.85
  );
  const e=new THREE.Euler().setFromQuaternion(xc.quaternion,'YXZ');
  e.x=0; e.z=0; UI.quaternion.setFromEuler(e);
  uiPlaced=true;
}

// ═══ DEMO MOUSE ════════════════════════════════════════════════════════════
renderer.domElement.addEventListener('mousemove',e=>{
  if(!demoMode)return;
  const mv=new THREE.Vector2((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  RC.setFromCamera(mv,camera);
  const hit=rayHit(RC.ray.origin,RC.ray.direction);
  setHov(hit?.id||null);
  if(hit){hitDot.position.copy(hit.point);hitDot.visible=true;}
  else hitDot.visible=false;
});
renderer.domElement.addEventListener('click',()=>{if(demoMode) doSelect(hovId);});

// ═══ RENDER LOOP ════════════════════════════════════════════════════════════
const clock=new THREE.Clock();
renderer.setAnimationLoop((time,frame)=>{
  if(xrSession){
    placeUI();
    if(frame) procHands(frame);
  } else if(demoMode){
    if(!uiPlaced){
      UI.position.set(0,0,-0.85);
      UI.rotation.set(0,0,0);
      uiPlaced=true;
    }
  }
  renderer.render(scene,camera);
});

// ═══ ENTRY ═════════════════════════════════════════════════════════════════
document.getElementById('ar-btn').addEventListener('click',async()=>{
  if(!navigator.xr){document.getElementById('no-xr').style.display='block';return;}
  const ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){document.getElementById('no-xr').style.display='block';return;}
  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local-floor'],
      optionalFeatures:['hand-tracking'],
    });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(xrSession);
    document.getElementById('start').style.display='none';
    startSess();
    xrSession.addEventListener('end',()=>{
      document.getElementById('start').style.display='flex';
      UI.visible=false; rayLine.visible=false; hitDot.visible=false;
      HANDS.forEach(h=>h.group.children.forEach(c=>c.visible=false));
      xrSession=null;
    });
  }catch(e){alert('AR: '+e.message);}
});

document.getElementById('demo-btn').addEventListener('click',()=>{
  demoMode=true;
  document.getElementById('start').style.display='none';
  startSess();
});

document.getElementById('restart-btn').addEventListener('click',()=>{
  document.getElementById('score-screen').style.display='none';
  uiPlaced=false;
  if(demoMode)startSess();
  else document.getElementById('start').style.display='flex';
});

UI.visible=false;
if(!navigator.xr){const b=document.getElementById('ar-btn');b.disabled=true;b.textContent='🥽 WebXR недоступен';}
</script>
</body>
