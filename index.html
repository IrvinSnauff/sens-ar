<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SensoryAR v6</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#04040c; color:#f0f0f0; font-family:'Space Mono',monospace; height:100dvh; overflow:hidden; }

.screen { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; background:#04040c; }
h1 { font-size:2.5rem; color:#b8ff57; margin-bottom:.2rem; }
.sub { font-size:.65rem; letter-spacing:.2em; color:#555; text-transform:uppercase; margin-bottom:1.5rem; }
.hint { width:100%; max-width:340px; margin-bottom:1.2rem; background:rgba(184,255,87,.05); border:1px solid rgba(184,255,87,.2); border-radius:12px; padding:.85rem 1rem; font-size:.7rem; line-height:1.8; color:#bbb; }
.hint strong { color:#b8ff57; }
.btn-p { font-weight:700; font-size:.85rem; background:#b8ff57; color:#04040c; border:none; border-radius:50px; padding:.9rem 2rem; cursor:pointer; width:100%; max-width:340px; margin-bottom:.6rem; }
.btn-s { font-size:.72rem; background:transparent; border:1px solid #333; color:#555; border-radius:50px; padding:.65rem 2rem; cursor:pointer; width:100%; max-width:340px; }
#no-xr { font-size:.68rem; color:#ff4d4d; margin-top:.8rem; display:none; text-align:center; }
.snum { font-size:4rem; font-weight:800; color:#b8ff57; line-height:1; margin-bottom:.4rem; }
#sbd { width:100%; max-width:300px; margin-bottom:1.5rem; }
.sr { display:flex; justify-content:space-between; padding:.45rem 0; border-bottom:1px solid #111; font-size:.7rem; }
.sr:last-child{border:none;} .ok{color:#b8ff57;} .fail{color:#ff4d4d;}
</style>
</head>
<body>

<div class="screen" id="start">
  <h1>SensoryAR</h1>
  <div class="sub">v6 · Quest 3 · Hand Tracking</div>
  <div class="hint">
    <strong>👆 Управление:</strong><br>
    Интерфейс всегда перед глазами в AR.<br>
    Скелет рук виден зелёными точками.<br>
    <strong>Щипок</strong> указательный + большой = выбор.<br>
    Контроллеры не нужны!
  </div>
  <button class="btn-p" id="ar-btn">🥽 Войти в AR</button>
  <button class="btn-s" id="demo-btn">🖥 Демо (мышь)</button>
  <div id="no-xr">WebXR недоступен. Откройте в Meta Browser.</div>
</div>

<div class="screen" id="score-screen" style="display:none">
  <div style="font-size:.6rem;letter-spacing:.2em;color:#444;text-transform:uppercase;margin-bottom:.8rem">Сессия завершена</div>
  <div class="snum" id="sc-num">0/0</div>
  <div style="font-size:.75rem;color:#555;margin-bottom:1.5rem" id="sc-pct"></div>
  <div id="sbd"></div>
  <button class="btn-p" id="restart-btn" style="max-width:300px">↺ Заново</button>
</div>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

// ═══ DATA ══════════════════════════════════════════════════════════════════
const TASTES = [
  {id:'sweet',  label:'Сладкий', emoji:'🍬', hex:0xff88cc, molecule:'Сахароза', thr:'0.5-2 г/л',    desc:'Рецепторы T1R2/T1R3'},
  {id:'salty',  label:'Солёный', emoji:'🧂', hex:0x44bbff, molecule:'NaCl',      thr:'0.3-1 г/л',    desc:'Na+ -> ENaC-каналы'},
  {id:'bitter', label:'Горький', emoji:'☕', hex:0xcc9933, molecule:'Кофеин',    thr:'0.05-0.3 г/л', desc:'>25 типов TAS2R'},
  {id:'umami',  label:'Умами',   emoji:'🍖', hex:0xff7755, molecule:'Глутамат Na',thr:'0.1-0.5 г/л', desc:'Синергист ИМФ/ГМФ'},
  {id:'pungent',label:'Острый',  emoji:'🌶', hex:0xff3333, molecule:'Капсаицин', thr:'0.0003 г/л',   desc:'TRPV1 тригеминальный'},
];

const JOINT_NAMES = [
  'wrist',
  'thumb-metacarpal','thumb-phalanx-proximal','thumb-phalanx-distal','thumb-tip',
  'index-finger-metacarpal','index-finger-phalanx-proximal','index-finger-phalanx-intermediate','index-finger-phalanx-distal','index-finger-tip',
  'middle-finger-metacarpal','middle-finger-phalanx-proximal','middle-finger-phalanx-intermediate','middle-finger-phalanx-distal','middle-finger-tip',
  'ring-finger-metacarpal','ring-finger-phalanx-proximal','ring-finger-phalanx-intermediate','ring-finger-phalanx-distal','ring-finger-tip',
  'pinky-finger-metacarpal','pinky-finger-phalanx-proximal','pinky-finger-phalanx-intermediate','pinky-finger-phalanx-distal','pinky-finger-tip',
];
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[8,9],[0,10],[10,11],[11,12],[12,13],[13,14],[0,15],[15,16],[16,17],[17,18],[18,19],[0,20],[20,21],[21,22],[22,23],[23,24],[5,10],[10,15],[15,20]];

// ═══ RENDERER ══════════════════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.001, 100);
scene.add(new THREE.AmbientLight(0xffffff, 1));

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ═══ CANVAS TEXTURE HELPER ═════════════════════════════════════════════════
function makeCanvas(w,h,drawFn){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d');
  drawFn(ctx,w,h);
  return new THREE.CanvasTexture(c);
}

function rr(ctx,x,y,w,h,r=16){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// Always-on-top material
function uiMat(tex){
  const m=new THREE.MeshBasicMaterial({map:tex,transparent:true,side:THREE.DoubleSide,depthTest:false,depthWrite:false});
  return m;
}

function uiPlane(w,h,tex){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),uiMat(tex));
  m.renderOrder=999;
  return m;
}

// ═══ UI GROUP — child of XR camera ═════════════════════════════════════════
// This group is added to the XR camera so it always faces the user
const UI = new THREE.Group();
// Position: 60cm in front, 10cm below eye level
UI.position.set(0, -0.10, -0.60);

// ── Background panel ────────────────────────────────────────────────────
const BG_W=512, BG_H=380;
let bgMesh = null;
function makeBG(ctx,w,h){
  ctx.fillStyle='#0d0d22';
  rr(ctx,4,4,w-8,h-8,24); ctx.fill();
  ctx.strokeStyle='#2a2a55'; ctx.lineWidth=4; ctx.stroke();
}

// ── Question card ────────────────────────────────────────────────────────
let qCardMesh=null;
function buildQuestionCard(sampleN, sampleTot){
  if(qCardMesh){UI.remove(qCardMesh);qCardMesh=null;}

  const W=512,H=380;
  const tex=makeCanvas(W,H,(ctx)=>{
    // BG
    ctx.fillStyle='#0d0d22'; rr(ctx,2,2,W-4,H-4,24); ctx.fill();
    ctx.strokeStyle='#333355'; ctx.lineWidth=3; ctx.stroke();

    // Eyebrow
    ctx.fillStyle='#555577'; ctx.font='14px "Space Mono",monospace';
    ctx.textAlign='left'; ctx.fillText('ОПРЕДЕЛИТЕ ВКУС', 24, 34);

    // Badge
    ctx.fillStyle='#0a1525';
    rr(ctx,W-140,14,122,32,16); ctx.fill();
    ctx.strokeStyle='#4488cc'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#55aaff'; ctx.font='bold 14px "Space Mono",monospace';
    ctx.textAlign='center'; ctx.fillText(`${sampleN} / ${sampleTot}`, W-79, 35);

    // Question
    ctx.fillStyle='#ffffff'; ctx.font='bold 20px "Space Mono",monospace';
    ctx.textAlign='left';
    ctx.fillText('Попробуйте образец.', 24, 78);
    ctx.fillText('Что вы ощущаете?', 24, 104);

    // Score
    ctx.fillStyle='#b8ff57'; ctx.font='bold 16px "Space Mono",monospace';
    ctx.textAlign='right'; ctx.fillText(`OK: ${okCount}/${totCount}`, W-24, 34);
  });

  qCardMesh=uiPlane(0.52,0.38,tex);
  qCardMesh.position.set(0,0.04,0);
  UI.add(qCardMesh);
}

// ── Taste buttons ────────────────────────────────────────────────────────
const BTN_MESHES=[];
const BTN_RECTS=[]; // {mesh, id, x3d, y3d, w3d, h3d} in UI local space

function buildButtons(states={}){
  BTN_MESHES.forEach(m=>UI.remove(m)); BTN_MESHES.length=0; BTN_RECTS.length=0;
  const BW=0.235, BH=0.075, GAP=0.012;
  const startX=-(BW+GAP/2);
  const rows=[[0,1],[2,3]];
  let rowY=-0.08;

  rows.forEach(pair=>{
    pair.forEach((ti,col)=>{
      const t=TASTES[ti];
      const x3d=startX+col*(BW+GAP);
      const y3d=rowY;
      const st=states[t.id]||'normal';

      const tex=makeCanvas(256,88,(ctx,W,H)=>{
        let bg='#111130', brd='#2a2a50', tc='#ffffff';
        if(st==='hov')    { bg='#1a2a10'; brd='#b8ff57'; }
        if(st==='correct'){ bg='#103010'; brd='#b8ff57'; tc='#b8ff57'; }
        if(st==='wrong')  { bg='#301010'; brd='#ff4455'; tc='#ff4455'; }
        ctx.fillStyle=bg; rr(ctx,2,2,W-4,H-4,14); ctx.fill();
        ctx.strokeStyle=brd; ctx.lineWidth=3; ctx.stroke();
        const col3=new THREE.Color(t.hex); tc=`#${col3.getHexString()}`;
        if(st==='correct') tc='#b8ff57';
        if(st==='wrong')   tc='#ff4455';
        ctx.fillStyle=tc; ctx.font='bold 20px "Space Mono",monospace';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(t.emoji+' '+t.label, W/2, H/2);
      });

      const m=uiPlane(BW,BH,tex);
      m.position.set(x3d+BW/2+startX*(col===0?0:-1)-(col===0?BW/2+GAP/4:-(BW/2+GAP/4)),y3d,0.001);
      // simpler positioning:
      m.position.set(startX+col*(BW+GAP)+BW/2, y3d, 0.001);
      UI.add(m); BTN_MESHES.push(m);
      BTN_RECTS.push({mesh:m, id:t.id, cx:startX+col*(BW+GAP)+BW/2, cy:y3d, hw:BW/2, hh:BH/2});
    });
    rowY-=BH+GAP;
  });

  // Wide button for last taste
  {
    const t=TASTES[4];
    const st=states[t.id]||'normal';
    const fullW=BW*2+GAP;
    const tex=makeCanvas(512,88,(ctx,W,H)=>{
      let bg='#111130', brd='#2a2a50';
      if(st==='hov')    { bg='#1a2a10'; brd='#b8ff57'; }
      if(st==='correct'){ bg='#103010'; brd='#b8ff57'; }
      if(st==='wrong')  { bg='#301010'; brd='#ff4455'; }
      ctx.fillStyle=bg; rr(ctx,2,2,W-4,H-4,14); ctx.fill();
      ctx.strokeStyle=brd; ctx.lineWidth=3; ctx.stroke();
      const col3=new THREE.Color(t.hex);
      let tc=`#${col3.getHexString()}`;
      if(st==='correct') tc='#b8ff57';
      if(st==='wrong')   tc='#ff4455';
      ctx.fillStyle=tc; ctx.font='bold 20px "Space Mono",monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(t.emoji+' '+t.label, W/2, H/2);
    });
    const m=uiPlane(fullW,BH,tex);
    m.position.set(startX+fullW/2, rowY, 0.001);
    UI.add(m); BTN_MESHES.push(m);
    BTN_RECTS.push({mesh:m, id:t.id, cx:startX+fullW/2, cy:rowY, hw:fullW/2, hh:BH/2});
  }
}

// ── Feedback card ────────────────────────────────────────────────────────
let fbMesh=null, nextMesh=null;
const NEXT_RECT={cx:0, cy:-0.20, hw:0.22, hh:0.038};

function buildFeedback(ok,t){
  if(fbMesh){UI.remove(fbMesh);fbMesh=null;}
  if(nextMesh){UI.remove(nextMesh);nextMesh=null;}

  const tex=makeCanvas(512,340,(ctx,W,H)=>{
    ctx.fillStyle='#0d0d22'; rr(ctx,2,2,W-4,H-4,24); ctx.fill();
    ctx.strokeStyle=ok?'#44ff44':'#ff4444'; ctx.lineWidth=4; ctx.stroke();

    ctx.fillStyle=ok?'#b8ff57':'#ff4444';
    ctx.font='bold 22px "Space Mono",monospace';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText((ok?'✓ Верно!  ':'✗ Неверно.  ')+t.emoji+' '+t.label, 22, 22);

    const rows=[['Вещество',t.molecule],['Порог',t.thr],['Описание',t.desc]];
    rows.forEach(([l,v],i)=>{
      ctx.fillStyle='#555577'; ctx.font='12px "Space Mono",monospace';
      ctx.fillText(l.toUpperCase(), 22, 70+i*68);
      ctx.fillStyle='#ccccdd'; ctx.font='15px "Space Mono",monospace';
      ctx.fillText(v, 22, 88+i*68);
    });
  });
  fbMesh=uiPlane(0.52,0.34,tex);
  fbMesh.position.set(0,0.06,0.001);
  UI.add(fbMesh);

  // Next button
  const ntex=makeCanvas(440,76,(ctx,W,H)=>{
    ctx.fillStyle='#b8ff57'; rr(ctx,2,2,W-4,H-4,14); ctx.fill();
    ctx.fillStyle='#04040c'; ctx.font='bold 18px "Space Mono",monospace';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('→ Следующий образец', W/2, H/2);
  });
  nextMesh=uiPlane(0.44,0.076,ntex);
  nextMesh.position.set(NEXT_RECT.cx, NEXT_RECT.cy, 0.001);
  UI.add(nextMesh);
}

function clearFeedback(){
  if(fbMesh){UI.remove(fbMesh);fbMesh=null;}
  if(nextMesh){UI.remove(nextMesh);nextMesh=null;}
}

// ═══ HAND SKELETON ═════════════════════════════════════════════════════════
const HAND_GROUPS=[new THREE.Group(),new THREE.Group()];
const HAND_JOINTS=[[], []];
const jMat=new THREE.MeshPhongMaterial({color:0xb8ff57,emissive:0x304000});
const bMat=new THREE.LineBasicMaterial({color:0x608030,transparent:true,opacity:0.6});

HAND_GROUPS.forEach((g,hi)=>{
  for(let i=0;i<25;i++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(i%5===4?0.009:0.006,8,8),jMat.clone());
    m.visible=false; g.add(m); HAND_JOINTS[hi].push(m);
  }
  BONES.forEach(([a,b])=>{
    const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),bMat.clone());
    l.visible=false; l.userData={a,b}; g.add(l);
  });
  scene.add(g);
});

// Finger ray
const rayGeo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);
const rayLine=new THREE.Line(rayGeo,new THREE.LineBasicMaterial({color:0xb8ff57,transparent:true,opacity:0.8}));
scene.add(rayLine); rayLine.visible=false;

// ═══ CUPS ══════════════════════════════════════════════════════════════════
const CUPS=new THREE.Group(); scene.add(CUPS);
const cupObjs=[];
[-0.22,0,0.22].forEach((x,i)=>{
  const g=new THREE.Group(); g.position.set(x,0,0);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.03,0.08,20),
    new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:0.2,side:THREE.DoubleSide})));
  const rm=new THREE.MeshPhongMaterial({color:0x444444,emissive:0x080808});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(0.055,0.006,8,48),rm);
  ring.rotation.x=Math.PI/2; ring.position.y=0.06; g.add(ring);
  const om=new THREE.MeshPhongMaterial({color:0x888888,emissive:0x111111,transparent:true,opacity:0.9});
  const orb=new THREE.Mesh(new THREE.SphereGeometry(0.02,12,12),om);
  orb.position.y=0.14; g.add(orb);
  CUPS.add(g); cupObjs.push({g,rm,om,orb});
});
function hlCup(ai){ cupObjs.forEach((c,i)=>{ const on=i===ai; c.rm.color.setHex(on?0xb8ff57:0x444444); c.rm.emissive.setHex(on?0x304000:0x080808); c.om.color.setHex(on?0xb8ff57:0x888888); c.g.scale.setScalar(on?1.35:1.0); }); }

// ═══ SESSION ═══════════════════════════════════════════════════════════════
let xrSession=null, demoMode=false;
let queue=[],qi=0,okCount=0,totCount=0,answered=false,results=[];
let lastPinch=false, hovId=null;
let phase='question'; // 'question'|'feedback'
let btnStates={};
let cupsPlaced=false;

function startSess(){
  queue=[...TASTES,...TASTES].sort(()=>Math.random()-.5);
  qi=0;okCount=0;totCount=0;answered=false;results=[];
  cupsPlaced=false;
  clearFeedback();
  showSample();
}

function showSample(){
  if(qi>=queue.length){endSess();return;}
  answered=false; phase='question'; hovId=null;
  TASTES.forEach(t=>btnStates[t.id]='normal');
  hlCup(qi%3);
  clearFeedback();
  buildQuestionCard(qi+1,queue.length);
  buildButtons(btnStates);
}

function onAnswer(id){
  if(answered||phase!=='question')return;
  answered=true;
  const t=queue[qi]; const ok=id===t.id;
  if(ok)okCount++; totCount++;
  results.push({taste:t,answer:id,ok});
  TASTES.forEach(bt=>{
    if(bt.id===t.id)         btnStates[bt.id]='correct';
    else if(bt.id===id&&!ok) btnStates[bt.id]='wrong';
    else                     btnStates[bt.id]='normal';
  });
  buildButtons(btnStates);
  phase='feedback';
  buildFeedback(ok,t);
  buildQuestionCard(qi+1,queue.length); // refresh score
}

function endSess(){
  UI.visible=false;
  const pct=totCount?Math.round(okCount/totCount*100):0;
  document.getElementById('sc-num').textContent=`${okCount}/${totCount}`;
  document.getElementById('sc-pct').textContent=pct>=90?`${pct}% — Отлично!`:pct>=70?`${pct}% — Хорошо.`:`${pct}% — Нужна практика.`;
  const bd=document.getElementById('sbd'); bd.innerHTML='';
  TASTES.forEach(t=>{const r=results.filter(x=>x.taste.id===t.id);const o=r.filter(x=>x.ok).length;bd.innerHTML+=`<div class="sr"><span>${t.emoji} ${t.label}</span><span class="${o===r.length?'ok':'fail'}">${o}/${r.length}</span></div>`;});
  document.getElementById('score-screen').style.display='flex';
  if(xrSession){xrSession.end();xrSession=null;}
}

// ═══ HIT TEST in UI local space ════════════════════════════════════════════
// Convert world ray to UI local space and test against button rects
const _ray=new THREE.Raycaster();
function hitTestUI(worldOrigin, worldDir){
  _ray.set(worldOrigin,worldDir);
  // Test against button planes
  const active=phase==='question'
    ? BTN_RECTS.filter(r=>btnStates[r.id]==='normal'||btnStates[r.id]==='hov')
    : [];

  for(const r of active){
    // Simple: intersect the UI plane (z=UI.position in world)
    const hits=_ray.intersectObject(r.mesh);
    if(hits.length) return {id:r.id};
  }
  if(phase==='feedback'&&nextMesh){
    const hits=_ray.intersectObject(nextMesh);
    if(hits.length) return {id:'__next__'};
  }
  return null;
}

// ═══ HAND TRACKING ═════════════════════════════════════════════════════════
function procHands(frame){
  const ref=renderer.xr.getReferenceSpace(); if(!ref) return;
  let anyHand=false;

  Array.from(xrSession.inputSources).forEach((src,hi)=>{
    if(!src.hand||hi>1)return;
    anyHand=true;
    const poses=[];
    JOINT_NAMES.forEach((name,ji)=>{
      const jt=src.hand.get(name);if(!jt){poses.push(null);return;}
      const p=frame.getJointPose(jt,ref);if(!p){poses.push(null);return;}
      const {x,y,z}=p.transform.position;
      HAND_JOINTS[hi][ji].position.set(x,y,z);
      HAND_JOINTS[hi][ji].visible=true;
      poses.push({x,y,z});
    });
    HAND_GROUPS[hi].children.forEach(c=>{
      if(c.userData.a===undefined)return;
      const a=poses[c.userData.a],b=poses[c.userData.b];
      if(a&&b){c.geometry.setFromPoints([new THREE.Vector3(a.x,a.y,a.z),new THREE.Vector3(b.x,b.y,b.z)]);c.geometry.attributes.position.needsUpdate=true;c.visible=true;}
      else c.visible=false;
    });

    if(hi===0){
      const iTip=poses[9],iProx=poses[6],tTip=poses[4];
      if(iTip&&iProx&&tTip){
        const dir=new THREE.Vector3(iTip.x-iProx.x,iTip.y-iProx.y,iTip.z-iProx.z).normalize();
        const org=new THREE.Vector3(iTip.x,iTip.y,iTip.z);
        rayGeo.setFromPoints([org,org.clone().addScaledVector(dir,0.6)]);
        rayGeo.attributes.position.needsUpdate=true;
        rayLine.visible=true;

        const hit=hitTestUI(org,dir);
        const newHov=hit?.id||null;
        if(newHov!==hovId){
          // update hover state
          if(hovId&&hovId!=='__next__'&&btnStates[hovId]==='hov') btnStates[hovId]='normal';
          hovId=newHov;
          if(hovId&&hovId!=='__next__') btnStates[hovId]='hov';
          buildButtons(btnStates);
        }

        const dist=Math.sqrt((iTip.x-tTip.x)**2+(iTip.y-tTip.y)**2+(iTip.z-tTip.z)**2);
        const pinching=dist<0.028;
        if(pinching&&!lastPinch&&hovId){
          if(hovId==='__next__'){qi++;showSample();}
          else onAnswer(hovId);
        }
        lastPinch=pinching;
      }
    }
  });

  if(!anyHand){
    HAND_GROUPS.forEach(g=>g.children.forEach(c=>c.visible=false));
    rayLine.visible=false; lastPinch=false; hovId=null;
  }
}

// ═══ CUP PLACEMENT ═════════════════════════════════════════════════════════
function placeCups(){
  if(cupsPlaced)return;
  const xc=renderer.xr.getCamera(camera);
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(xc.quaternion);
  fwd.y=0; fwd.normalize();
  CUPS.position.set(xc.position.x+fwd.x*0.65, 0.78, xc.position.z+fwd.z*0.65);
  const e=new THREE.Euler().setFromQuaternion(xc.quaternion,'YXZ');
  e.x=0;e.z=0; CUPS.quaternion.setFromEuler(e);
  cupsPlaced=true;
}

// ═══ DEMO MOUSE ════════════════════════════════════════════════════════════
const _mv=new THREE.Vector2();
renderer.domElement.addEventListener('mousemove',e=>{
  if(!demoMode)return;
  _mv.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);
  _ray.setFromCamera(_mv,camera);
  const hit=hitTestUI(_ray.ray.origin,_ray.ray.direction);
  const newHov=hit?.id||null;
  if(newHov!==hovId){
    if(hovId&&hovId!=='__next__'&&btnStates[hovId]==='hov') btnStates[hovId]='normal';
    hovId=newHov;
    if(hovId&&hovId!=='__next__') btnStates[hovId]='hov';
    buildButtons(btnStates);
  }
});
renderer.domElement.addEventListener('click',e=>{
  if(!demoMode)return;
  if(hovId){
    if(hovId==='__next__'){qi++;showSample();}
    else onAnswer(hovId);
  }
});

// ═══ RENDER LOOP ═══════════════════════════════════════════════════════════
const clock=new THREE.Clock();
renderer.setAnimationLoop((time,frame)=>{
  const t=clock.getElapsedTime();
  cupObjs.forEach((c,i)=>{c.orb.position.y=0.14+Math.sin(t*1.4+i*1.3)*0.012;c.orb.rotation.y=t*0.6;});

  if(xrSession){
    // Attach UI to XR camera every frame
    const xc=renderer.xr.getCamera(camera);
    if(!UI.parent||UI.parent!==xc) xc.add(UI);
    placeCups();
    if(frame) procHands(frame);
  } else if(demoMode){
    if(!UI.parent||UI.parent!==camera) camera.add(UI);
    CUPS.position.set(0,-0.35,-1.0);
  }
  renderer.render(scene,camera);
});

// ═══ ENTRY ═════════════════════════════════════════════════════════════════
document.getElementById('ar-btn').addEventListener('click',async()=>{
  if(!navigator.xr){document.getElementById('no-xr').style.display='block';return;}
  const ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){document.getElementById('no-xr').style.display='block';return;}
  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['local-floor'],
      optionalFeatures:['hand-tracking'],
    });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(xrSession);
    document.getElementById('start').style.display='none';
    UI.visible=true;
    startSess();
    xrSession.addEventListener('end',()=>{
      document.getElementById('start').style.display='flex';
      UI.visible=false; if(UI.parent) UI.parent.remove(UI);
      xrSession=null;
    });
  }catch(e){alert('AR ошибка: '+e.message);}
});

document.getElementById('demo-btn').addEventListener('click',()=>{
  demoMode=true;
  document.getElementById('start').style.display='none';
  UI.visible=true; startSess();
});

document.getElementById('restart-btn').addEventListener('click',()=>{
  document.getElementById('score-screen').style.display='none';
  UI.visible=true;
  if(demoMode)startSess();
  else document.getElementById('start').style.display='flex';
});

UI.visible=false;
if(!navigator.xr){const b=document.getElementById('ar-btn');b.disabled=true;b.textContent='🥽 WebXR недоступен';}
</script>
